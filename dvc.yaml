stages:
  prepare:
    cmd: >-
      python -m purchase_intent.data_split
      --input data/raw/online_shoppers_intention.csv
      --output-dir data/processed
      --params configs/params.yaml
    deps:
      - data/raw/online_shoppers_intention.csv
      - src/purchase_intent/__init__.py
      - src/purchase_intent/config.py
      - src/purchase_intent/schema.py
      - src/purchase_intent/data_schema.py
      - src/purchase_intent/data_split.py
      - pyproject.toml
      - poetry.lock
    params:
      - configs/params.yaml:
          - seed
          - dataset.target_column
          - split.test_size
          - split.stratify
    outs:
      - data/processed/train.csv
      - data/processed/test.csv
      - data/processed/split_manifest.json
  validate:
    cmd: >-
      python -m purchase_intent.data_validation
      --raw data/raw/online_shoppers_intention.csv
      --train data/processed/train.csv
      --test data/processed/test.csv
      --manifest data/processed/split_manifest.json
      --report reports/data_validation.json
      --params configs/params.yaml
    deps:
      - data/raw/online_shoppers_intention.csv
      - data/processed/train.csv
      - data/processed/test.csv
      - data/processed/split_manifest.json
      - src/purchase_intent/__init__.py
      - src/purchase_intent/config.py
      - src/purchase_intent/schema.py
      - src/purchase_intent/data_schema.py
      - src/purchase_intent/data_split.py
      - src/purchase_intent/data_validation.py
      - pyproject.toml
      - poetry.lock
    params:
      - configs/params.yaml:
          - seed
          - dataset.target_column
          - split.test_size
          - split.stratify
    outs:
      - reports/data_validation.json
  train:
    cmd: >-
      python -m purchase_intent.train
      --train data/processed/train.csv
      --model-output models/trained_pipeline
      --run-id-output reports/train_run_id.txt
      --params configs/params.yaml
    deps:
      - data/processed/train.csv
      - src/purchase_intent/config.py
      - src/purchase_intent/data_schema.py
      - src/purchase_intent/data_split.py
      - src/purchase_intent/preprocessing.py
      - src/purchase_intent/schema.py
      - src/purchase_intent/train.py
      - pyproject.toml
      - poetry.lock
    params:
      - configs/params.yaml:
          - seed
          - dataset.target_column
          - model.name
          - model.params
    outs:
      - models/trained_pipeline
      - reports/train_run_id.txt
  evaluate:
    cmd: >-
      python -m purchase_intent.evaluation
      --test data/processed/test.csv
      --model models/trained_pipeline
      --run-id reports/train_run_id.txt
      --metrics reports/metrics.json
      --params configs/params.yaml
    deps:
      - data/processed/test.csv
      - models/trained_pipeline
      - reports/train_run_id.txt
      - src/purchase_intent/config.py
      - src/purchase_intent/data_schema.py
      - src/purchase_intent/data_split.py
      - src/purchase_intent/evaluation.py
      - pyproject.toml
      - poetry.lock
    params:
      - configs/params.yaml:
          - dataset.target_column
          - evaluation.decision_threshold
    metrics:
      - reports/metrics.json
  register:
    cmd: >-
      python -m purchase_intent.registry
      --run-id reports/train_run_id.txt
      --metrics reports/metrics.json
      --params configs/params.yaml
      --report reports/registry.json
    deps:
      - reports/train_run_id.txt
      - reports/metrics.json
      - models/trained_pipeline
      - src/purchase_intent/config.py
      - src/purchase_intent/data_schema.py
      - src/purchase_intent/registry.py
      - src/purchase_intent/train.py
      - pyproject.toml
      - poetry.lock
    params:
      - configs/params.yaml:
          - evaluation.primary_metric
          - registry.alias
    outs:
      - reports/registry.json
    always_changed: true
