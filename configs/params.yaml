# Parâmetros do experimento — versionados no git.
#
# Divisão de responsabilidade com o .env:
#   .env         -> infraestrutura e ambiente (URIs, caminhos, nível de log)
#   params.yaml  -> decisões de modelagem (o "o quê" do experimento)
#
# Neste arquivo ficam as decisões que invalidam os stages correspondentes no DVC.
# Alterar um parâmetro faz o DVC reexecutar os stages afetados.

seed: 42

dataset:
  target_column: Revenue

split:
  test_size: 0.2
  stratify: true

model:
  # Vencedor do benchmark comparativo (3 algoritmos x com/sem balanceamento),
  # escolhido pela métrica `evaluation.primary_metric`. Sem `class_weight`:
  # a variante sem balanceamento teve o melhor ROC AUC.
  name: hist_gradient_boosting
  params:
    learning_rate: 0.05
    max_iter: 200
    max_leaf_nodes: 31
    min_samples_leaf: 20

evaluation:
  # Métrica de decisão para promover um modelo no Model Registry.
  primary_metric: roc_auc
  decision_threshold: 0.5

registry:
  alias: champion
